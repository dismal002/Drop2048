plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dismal.drop2048'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dismal.drop2048'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies on purpose: the app is plain framework Java (no AndroidX, no WebView).
